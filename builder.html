<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Policy Builder — a structured workspace for drafting federal-style legislation.">
  <title>Builder — The Ledger</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/builder.css">
</head>
<body>
  <div id="site-nav"></div>

  <div class="layout-builder">

    <!-- Left: Archive Reference Sidebar -->
    <aside class="ref-sidebar" aria-label="Archive references">
      <div class="ref-sidebar-header">
        <p class="section-label">Archive</p>
        <input
          class="form-input"
          id="ref-search"
          type="search"
          placeholder="Search resources…"
          aria-label="Search archive resources"
          autocomplete="off"
          style="margin-top: var(--space-2);"
        >
      </div>
      <ul class="ref-list" id="ref-list" role="list" aria-label="Archive resources — click to pin">
        <!-- Rendered by builder.js -->
      </ul>
    </aside>

    <!-- Center: Bill Editor -->
    <main class="editor" aria-label="Bill drafting editor">
      <div class="editor-chrome">
        <div class="editor-chrome-left">
          <input
            class="draft-title-input"
            id="draft-title"
            type="text"
            placeholder="Untitled Draft"
            aria-label="Draft title"
            autocomplete="off"
          >
        </div>
        <div style="display:flex; align-items:center; gap: var(--space-3); flex-shrink:0;">
          <select class="draft-select" id="draft-select" aria-label="Load a draft">
            <option value="new">+ New draft</option>
          </select>
          <span class="autosave-status" id="autosave-status" aria-live="polite"></span>
        </div>
        <div class="editor-actions">
          <button class="btn btn-secondary btn-sm" id="save-draft-btn" type="button">Save</button>
          <button class="btn btn-secondary btn-sm" id="export-btn" type="button">Export .md</button>
          <button class="btn btn-ghost btn-sm" id="export-txt-btn" type="button">Export .txt</button>
          <button class="btn btn-ghost btn-sm" id="delete-draft-btn" type="button" title="Delete this draft" aria-label="Delete draft">Delete</button>
        </div>
      </div>

      <div id="bill-sections">
        <!-- Bill section textareas rendered by builder.js -->
      </div>
    </main>

    <!-- Right: Pinned References Panel -->
    <aside class="ref-panel" aria-label="Pinned references">
      <div class="ref-panel-header">
        <p class="section-label">Active References</p>
      </div>
      <div id="ref-panel-content">
        <!-- Rendered by builder.js -->
      </div>
    </aside>

  </div>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/builder.js"></script>
</body>
</html>
